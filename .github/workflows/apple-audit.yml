name: Apple audit smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ios/apple-audit/**'
      - 'src/ios/apple-audit.mjs'
      - 'test/ios-apple-audit-smoke.mjs'
      - '.github/workflows/apple-audit.yml'

permissions:
  contents: read

concurrency:
  group: apple-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Audit a real simulator fixture and reject an unavailable target
        run: node test/ios-apple-audit-smoke.mjs
      - name: Keep native audit diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-audit-smoke
          path: |
            aloud-report/apple-smoke/apple-audit/*.log
            aloud-report/apple-smoke/apple-audit/*.json
            aloud-report/apple-smoke/apple-audit/*.xcresult
          retention-days: 7
