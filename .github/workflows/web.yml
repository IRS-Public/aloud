name: Experimental web evidence
on:
  pull_request:
    paths: ['src/web/**', 'src/report/**', 'src/config.mjs', 'bin/**', 'test/web*', 'test/web-fixture/**', 'test/real-app/web.mjs', 'package*.json', '.github/workflows/web.yml']
  workflow_dispatch:
    inputs:
      nvda:
        description: Run the experimental NVDA fixtures on a dedicated Windows runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run test:web:external
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: web-external-chromium-evidence
          path: aloud-report/web-external-none
          retention-days: 14
  nvda:
    if: github.event_name == 'workflow_dispatch' && inputs.nvda
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx --yes @guidepup/setup@0.25.3 setup --ci
      - run: npx --yes @guidepup/setup@0.25.3 install
      - run: npm run test:web:nvda
      - run: npm run test:web:external
        env:
          ALOUD_WEB_READER: nvda
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-nvda-evidence
          path: |
            aloud-report/web-nvda-smoke
            aloud-report/web-external-nvda
          retention-days: 14
