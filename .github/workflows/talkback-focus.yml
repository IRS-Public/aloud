name: Android companion acceptance
on:
  pull_request:
    paths: ['src/android/**', 'src/report/**', 'src/config.mjs', 'bin/**', 'test/android-*', 'test/android-fixture/**', 'test/android-tts-fixture/**', '.github/workflows/talkback-focus.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talkback-focus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Prepare Gradle and emulator memory
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.workers.max=2
          PROPS
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v5
        id: gradle-cache
        with:
          path: ~/.gradle/caches
          key: talkback-gradle-${{ runner.os }}-${{ hashFiles('src/android/talkback-companion/**', 'src/android/tts-shared/**', 'test/android-fixture/*.gradle') }}
          restore-keys: talkback-gradle-${{ runner.os }}-
      - uses: actions/cache/restore@v5
        id: apk
        with:
          path: .aloud-cache/*.apk
          key: talkback-companion-${{ hashFiles('src/android/get-talkback.sh', 'src/android/talkback-companion/**', 'src/android/tts-shared/**') }}
      - name: Build pinned TalkBack with emulator companion
        if: steps.apk.outputs.cache-hit != 'true'
        run: bash src/android/get-talkback.sh --build --companion --no-native
      - name: Build native acceptance fixture
        run: |
          gradle -p test/android-fixture assembleDebug
          gradle -p test/android-tts-fixture assembleDebug
          bash src/android/get-logging-tts.sh
      - uses: actions/cache/save@v5
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.gradle/caches
          key: talkback-gradle-${{ runner.os }}-${{ hashFiles('src/android/talkback-companion/**', 'src/android/tts-shared/**', 'test/android-fixture/*.gradle') }}
      - uses: actions/cache/save@v5
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          path: .aloud-cache/*.apk
          key: talkback-companion-${{ hashFiles('src/android/get-talkback.sh', 'src/android/talkback-companion/**', 'src/android/tts-shared/**') }}
      - name: Boot Android 14 emulator
        run: bash src/android/boot-emulator-ci.sh
      - name: Install native fixtures
        run: |
          # Keep first-boot Assistant onboarding notifications out of positive fixtures.
          # The suite injects a foreign notification explicitly as a negative case.
          "$ANDROID_HOME/platform-tools/adb" shell pm disable-user --user 0 com.google.android.googlequicksearchbox
          node bin/aloud.mjs talkback install .aloud-cache/talkback.apk
          "$ANDROID_HOME/platform-tools/adb" install -r -g test/android-fixture/build/outputs/apk/debug/AloudFocusFixture-debug.apk
          "$ANDROID_HOME/platform-tools/adb" install -r -g test/android-tts-fixture/build/outputs/apk/debug/AloudTtsFixture-debug.apk
          "$ANDROID_HOME/platform-tools/adb" install -r -g .aloud-cache/logging-tts.apk
      - name: Check TalkBack focus traversal
        run: node test/android-focus-smoke.mjs
      - name: Check native ATF capture and cleanup
        run: node test/android-atf-smoke.mjs
      - name: Check logging TTS traversal and cleanup
        run: node test/android-tts-smoke.mjs
      - name: Check TTS queue accounting and process recovery
        run: node test/android-tts-engine-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: talkback-focus-evidence
          path: |
            aloud-report/focus-smoke
            aloud-report/tts-smoke
            aloud-report/tts-engine-smoke
            aloud-report/atf-smoke
            ${{ runner.temp }}/emulator.log
          retention-days: 14
