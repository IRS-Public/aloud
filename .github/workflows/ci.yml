name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the engines floor; 24 is what the adopter CI templates install.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - name: Syntax-check every script
        run: |
          set -e
          for f in bin/*.mjs $(find src -name '*.mjs'); do node --check "$f"; done
          for f in $(find src -name '*.sh'); do bash -n "$f"; done
