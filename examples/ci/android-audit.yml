name: aloud 508 audit (Android)

# Adopter template. Copy this file into your app repo at
# .github/workflows/, fill in the two "replace" blocks, and commit an
# aloud.config.json at your repo root (see examples/aloud.config.example.json;
# the Android leg needs at least app.android.package).
#
# Every step here earned its place on real runs; the reasons are in
# docs/ci.md in the aloud repository. Only GitHub-owned actions are used.
#
# Note: `schedule` triggers only fire from the repo's default branch. A
# nightly on a feature branch never runs. Use workflow_dispatch to test.

on:
  workflow_dispatch:
    inputs:
      flows:
        description: "Comma-separated flow ids (empty = all)"
        required: false
        default: ""
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

jobs:
  android-talkback-audit:
    name: TalkBack transcripts + tree checks (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # google/talkback pin. Bump deliberately: the utterance-log extractors
      # in aloud's src/android/transcript.mjs are verified against this
      # commit (see docs/talkback.md in the aloud repository).
      TALKBACK_COMMIT: 229212fdf5842191d0a93fc95d9ca1423b346866
      FLOWS: ${{ inputs.flows || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install aloud
        run: npm install --no-save github:IRS-Public/aloud

      # The TalkBack source build, the NDK, and the emulator image need more
      # disk than a stock runner has free.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
            /usr/local/lib/heroku /usr/share/miniconda /opt/az /usr/lib/google-cloud-sdk
          sudo docker system prune -af --volumes > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Restore/save are split on purpose: a plain actions/cache post-job
      # save never runs if a later step kills the runner. Bank each cache
      # right after the expensive step that filled it.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', 'package-lock.json') }}

      # ~/.gradle/gradle.properties outranks every project gradle.properties,
      # so this caps BOTH your app build and the TalkBack source build.
      # TalkBack's own gradle.properties demands -Xmx8G, which OOM-kills a
      # 7GB runner. No daemons, 2 workers, capped heaps.
      - name: Cap Gradle memory (7GB runner)
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=true"
            echo "org.gradle.workers.max=2"
            echo "kotlin.daemon.jvmargs=-Xmx1536m"
          } > ~/.gradle/gradle.properties

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore TalkBack APK cache
        id: talkback-cache
        uses: actions/cache/restore@v4
        with:
          path: .aloud-cache
          key: talkback-companion-${{ env.TALKBACK_COMMIT }}-${{ hashFiles('node_modules/@irs-public/aloud/src/android/talkback-companion/**', 'node_modules/@irs-public/aloud/src/android/get-talkback.sh') }}

      # Cache the pin and companion source together; patch changes require a rebuild.
      - name: Build TalkBack from source (cache miss only)
        if: steps.talkback-cache.outputs.cache-hit != 'true'
        run: |
          # TalkBack's build.sh wants a system gradle >= 8.13 (no wrapper in
          # that repo); install one just for this step.
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/gradle-8.14.3/bin:$PATH"
          npx aloud talkback get --build --companion --no-native

      - name: Save TalkBack APK cache (immediately, so later failures cannot lose it)
        if: steps.talkback-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .aloud-cache
          key: talkback-companion-${{ env.TALKBACK_COMMIT }}-${{ hashFiles('node_modules/@irs-public/aloud/src/android/talkback-companion/**', 'node_modules/@irs-public/aloud/src/android/get-talkback.sh') }}

      # --- replace with your app's build ---
      # Produce a debug APK for the emulator ABI. For a React Native app:
      #   ( cd android && ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 )
      # Building only the x86_64 slice skips 3 of 4 arch slices.
      - name: Build app debug APK
        run: |
          echo "REPLACE ME: build your app APK here"
          exit 1
      # --- end replace ---

      - name: Save Gradle cache (immediately, so later failures cannot lose it)
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', 'package-lock.json') }}

      # boot-emulator-ci.sh pins ANDROID_AVD_HOME (newer avdmanager writes
      # AVDs where the emulator does not look) and bounds the boot wait so a
      # dead emulator fails in minutes, not at the job timeout.
      - name: Boot emulator (API 34 google_apis x86_64, headless)
        run: |
          bash node_modules/@irs-public/aloud/src/android/boot-emulator-ci.sh
          # Later steps call bare `adb`; platform-tools is not on the
          # runner's default PATH.
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Run audit on emulator
        run: |
          # The companion emulator build omits braille native libraries and
          # disables braille-display initialization.
          npx aloud talkback install .aloud-cache/talkback.apk
          npx aloud talkback status
          # --- replace with your app's audit invocation ---
          npx aloud android --apk path/to/app-debug.apk --talkback focus --no-gate \
            ${FLOWS:+--flow "$FLOWS"}
          # --- end replace ---

      # Advisory while your baselines burn in. Drop continue-on-error once
      # they are stable to make regressions fail the job.
      - name: Ratchet gate
        continue-on-error: true
        run: npx aloud report --dir aloud-report/android --gate

      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aloud-508-report-android
          path: aloud-report/android/
          retention-days: 90
