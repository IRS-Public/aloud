name: AloudAppleAudit
options:
  bundleIdPrefix: org.aloud.audit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  AuditHost:
    type: application
    platform: iOS
    sources: [HostApp]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  AloudAppleAuditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AuditHost
    settings:
      base:
        TEST_TARGET_NAME: AuditHost
  AuditFixture:
    type: application
    platform: iOS
    sources: [FixtureApp]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
schemes:
  AloudAppleAuditFixture:
    build:
      targets:
        AuditFixture: all
  AloudAppleAudit:
    build:
      targets:
        AuditHost: all
        AloudAppleAuditUITests: all
    test:
      targets:
        - AloudAppleAuditUITests
