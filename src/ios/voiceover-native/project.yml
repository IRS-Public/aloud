name: AloudVoiceOver
options:
  bundleIdPrefix: org.aloud.voiceover
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
targets:
  HostApp:
    type: application
    platform: iOS
    sources: [HostApp]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  AloudVoiceOverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HostApp
    settings:
      base:
        TEST_TARGET_NAME: HostApp
  VoiceOverFixture:
    type: application
    platform: iOS
    sources: [FixtureApp]
    info:
      path: FixtureInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [aloud-voiceover-fixture]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
schemes:
  AloudVoiceOver:
    build:
      targets:
        HostApp: all
        AloudVoiceOverUITests: all
    test:
      targets: [AloudVoiceOverUITests]
  AloudVoiceOverFixture:
    build:
      targets:
        VoiceOverFixture: all
